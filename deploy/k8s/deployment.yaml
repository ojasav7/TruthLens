apiVersion: apps/v1
kind: Deployment
metadata:
  name: truthlens-backend
  labels:
    app: truthlens
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: truthlens
      component: backend
  template:
    metadata:
      labels:
        app: truthlens
        component: backend
    spec:
      containers:
        - name: backend
          image: truthlens-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: truthlens-secrets
                  key: database-url
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: truthlens-backend
spec:
  selector:
    app: truthlens
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: truthlens-config
data:
  ENVIRONMENT: "production"
  TL_INVESTIGATION_MODE: "true"
  TL_EVIDENCE_ENGINE: "true"
  TL_AUDIT_TRAIL: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: truthlens-secrets
type: Opaque
stringData:
  database-url: "sqlite+aiosqlite:///./truthlens.db"
  secret-key: "changeme-in-production"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: truthlens-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: truthlens-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
