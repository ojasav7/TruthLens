<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #f1f5f9; padding: 16px;
    }
    h1 { font-size: 16px; margin-bottom: 4px; }
    .status { font-size: 12px; margin-bottom: 12px; }
    .section { margin-bottom: 16px; }
    .section h2 { font-size: 12px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    textarea {
      width: 100%; height: 80px; background: #1e293b; border: 1px solid #334155;
      border-radius: 8px; color: #f1f5f9; padding: 8px; font-size: 13px; resize: none;
    }
    textarea:focus { outline: none; border-color: #06b6d4; }
    button {
      width: 100%; padding: 10px; background: #06b6d4; color: white; border: none;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; margin-top: 8px;
    }
    button:hover { background: #0891b2; }
    input[type="file"] { display: none; }
    .file-label {
      display: block; text-align: center; padding: 12px; background: #1e293b;
      border: 2px dashed #334155; border-radius: 8px; cursor: pointer; font-size: 12px; color: #94a3b8;
    }
    .file-label:hover { border-color: #06b6d4; }
    #result { margin-top: 8px; }
    #history { max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>🔍 TruthLens</h1>
  <div class="status" id="status">Checking connection...</div>

  <div class="section">
    <h2>Text Analysis</h2>
    <textarea id="text-input" placeholder="Paste suspicious text, news headline, or social media post..."></textarea>
    <button id="analyze-text">🔎 Analyze Text</button>
  </div>

  <div class="section">
    <h2>File Analysis</h2>
    <label class="file-label" for="file-input">
      📁 Click to upload image, video, or audio
    </label>
    <input type="file" id="file-input" accept="image/*,video/*,audio/*">
  </div>

  <div id="result"></div>

  <div class="section" style="margin-top:16px;">
    <h2>Recent Analyses</h2>
    <div id="history"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
