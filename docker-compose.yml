version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./truthlens.db
      - MODEL_DIR=./models
      - ENVIRONMENT=production
    volumes:
      - model-weights:/app/models
      - db-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  frontend:
    image: python:3.12-slim
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir streamlit plotly requests &&
               streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true"
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  model-weights:
  db-data:
